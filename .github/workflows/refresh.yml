name: Refresh encrypted Stars
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: encrypted-star-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Refresh public Stars and encrypt snapshot
        env:
          ATLAS_ACCESS_PASSWORD: ${{ secrets.ATLAS_ACCESS_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/refresh.mjs
      - name: Publish encrypted snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/vault.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh encrypted public-Star snapshot'
            git push
          fi
          gh api "repos/$GITHUB_REPOSITORY/pages/builds" --method POST --silent
